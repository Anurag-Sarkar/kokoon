name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          # Dedicated deploy-only key (see README) — not a personal key.
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            cd /opt/kokoon
            ./deploy.sh
