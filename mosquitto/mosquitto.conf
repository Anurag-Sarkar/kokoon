# Kokoon Mosquitto config.
# Pure message forwarding — no app logic lives here. Auth/ACL decisions are
# delegated over HTTP to the ws API (backed by the Postgres `devices` table).

per_listener_settings false
allow_anonymous false
log_dest stdout

# Retained /sub snapshots must survive broker restarts.
persistence true
persistence_location /mosquitto/data/

# Internal listener — docker network only (never published to the host).
# Used by the ingestion process and ws workers with backend credentials.
listener 1883
protocol mqtt

# Device-facing listener — MQTT over TLS.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# mosquitto-go-auth, HTTP backend → ws API (devices table is the source of truth).
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host ws
auth_opt_http_port 3000
auth_opt_http_getuser_uri /mqtt/user
auth_opt_http_superuser_uri /mqtt/superuser
auth_opt_http_aclcheck_uri /mqtt/acl
auth_opt_http_with_tls false
auth_opt_http_response_mode status
auth_opt_http_params_mode form
